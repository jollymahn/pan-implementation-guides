<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00294D"/>
    </marker>
    <marker id="ar-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#00294D"/>
    </marker>
    <marker id="ar-up" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006DCC"/>
    </marker>
    <marker id="ar-down" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#006DCC"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  SCAN API BOX (TOP CENTER)                        -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="280" y="16" width="320" height="190" rx="10" ry="10"
        fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <!-- Gold header -->
  <rect x="280" y="16" width="320" height="40" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="280" y="36" width="320" height="20" fill="#FFB81C"/>
  <text x="440" y="43" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">
    🔍  Prisma AIRS Scan API
  </text>

  <!-- Threat Detection sub-box -->
  <rect x="300" y="68" width="280" height="125" rx="6" ry="6"
        fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="310" y="88" font-size="11" font-weight="700" fill="#00294D">Threat Detection</text>

  <text x="320" y="108" font-size="10.5" fill="#333">├ Prompt Injection</text>
  <text x="320" y="123" font-size="10.5" fill="#333">├ DLP / Sensitive Data</text>
  <text x="320" y="138" font-size="10.5" fill="#333">├ Toxic Content</text>
  <text x="320" y="153" font-size="10.5" fill="#333">├ Malicious Code</text>
  <text x="320" y="168" font-size="10.5" fill="#333">├ URL Categorization</text>
  <text x="320" y="183" font-size="10.5" fill="#333">└ Agent Threats</text>

  <!-- Verdict badge -->
  <rect x="480" y="80" width="90" height="50" rx="6" ry="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="525" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">VERDICT</text>
  <text x="525" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">allow / block</text>

  <!-- Auth badge -->
  <rect x="480" y="140" width="90" height="40" rx="6" ry="6" fill="#e7f3ff" stroke="#006DCC" stroke-width="1"/>
  <text x="525" y="156" text-anchor="middle" font-size="9" font-weight="600" fill="#006DCC">AUTH</text>
  <text x="525" y="170" text-anchor="middle" font-size="9.5" fill="#00294D">x-pan-token</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  USER (LEFT)                                      -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="270" width="130" height="70" rx="8" ry="8"
        fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="95" y="298" text-anchor="middle" font-size="22">👤</text>
  <text x="95" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#00294D">User</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  YOUR APP (CENTER)                                -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="350" y="260" width="180" height="90" rx="8" ry="8"
        fill="#e7f3ff" stroke="#006DCC" stroke-width="2"/>
  <text x="440" y="296" text-anchor="middle" font-size="20">⚙️</text>
  <text x="440" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">Your Application</text>
  <text x="440" y="340" text-anchor="middle" font-size="9.5" fill="#666">Integration logic here</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  AI MODEL (RIGHT)                                 -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="720" y="270" width="130" height="70" rx="8" ry="8"
        fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="785" y="296" text-anchor="middle" font-size="20">🤖</text>
  <text x="785" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#00294D">AI Model</text>

  <!-- Model list -->
  <text x="785" y="360" text-anchor="middle" font-size="9" fill="#666">OpenAI · Bedrock · Vertex AI</text>
  <text x="785" y="373" text-anchor="middle" font-size="9" fill="#666">Azure OAI · Any provider</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  FLOW ARROWS WITH STEP NUMBERS                    -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Step 1: User → App (prompt) -->
  <line x1="162" y1="295" x2="348" y2="295" stroke="#00294D" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ar-r)"/>
  <!-- Step 1 badge -->
  <circle cx="255" cy="282" r="12" fill="#00294D"/>
  <text x="255" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
  <text x="255" y="275" text-anchor="middle" font-size="8.5" fill="#666">Prompt</text>

  <!-- Step 2: App → Scan API (scan prompt) -->
  <line x1="440" y1="258" x2="440" y2="208" stroke="#006DCC" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ar-up)"/>
  <!-- Step 2 badge -->
  <circle cx="458" cy="234" r="12" fill="#006DCC"/>
  <text x="458" y="239" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
  <text x="484" y="239" font-size="8.5" fill="#006DCC">Scan prompt</text>

  <!-- Step 3: App → AI Model (forward if allowed) -->
  <line x1="532" y1="300" x2="718" y2="300" stroke="#22c55e" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ar-r)"/>
  <!-- Step 3 badge -->
  <circle cx="625" cy="287" r="12" fill="#22c55e"/>
  <text x="625" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
  <text x="625" y="279" text-anchor="middle" font-size="8.5" fill="#16a34a">Forward if allowed</text>

  <!-- Step 4: AI Model → App (response) + scan -->
  <line x1="718" y1="318" x2="532" y2="318" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ar-l)"/>
  <!-- Step 4 badge -->
  <circle cx="625" cy="330" r="12" fill="#E5A300"/>
  <text x="625" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
  <text x="625" y="350" text-anchor="middle" font-size="8.5" fill="#b45309">Scan response</text>

  <!-- Step 5: App → User (return if allowed) -->
  <line x1="348" y1="318" x2="162" y2="318" stroke="#22c55e" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ar-l)"/>
  <!-- Step 5 badge -->
  <circle cx="255" cy="330" r="12" fill="#22c55e"/>
  <text x="255" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
  <text x="255" y="350" text-anchor="middle" font-size="8.5" fill="#16a34a">Return if allowed</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STRATA CLOUD MANAGER (BOTTOM)                    -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="340" y="400" width="200" height="50" rx="10" ry="10"
        fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">
    Strata Cloud Manager
  </text>
  <text x="440" y="439" text-anchor="middle" font-size="10" fill="#666">
    Logs  ·  Discovery  ·  Policy
  </text>

  <!-- Arrow from App to SCM -->
  <line x1="440" y1="352" x2="440" y2="398" stroke="#006DCC" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ar-down)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  BOTTOM CALLOUT                                   -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="470" width="820" height="36" rx="6" ry="6" fill="#e7f3ff" stroke="none"/>
  <text x="440" y="493" text-anchor="middle" font-size="10.5" fill="#006DCC">
    ℹ️  Model-agnostic design — works with any AI model (public, private, or self-hosted). Your application controls the integration flow.
  </text>

</svg>
