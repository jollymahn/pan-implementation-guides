<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 880 620" width="880" height="620"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <!-- ── Definitions ─────────────────────────────────── -->
  <defs>
    <marker id="arrow-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#555"/>
    </marker>
    <marker id="arrow-down" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#006DCC"/>
    </marker>
    <marker id="arrow-r-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A300"/>
    </marker>
    <marker id="arrow-l-gold" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#E5A300"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  CENTRAL FIREWALL BOX                             -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Outer firewall container -->
  <rect x="260" y="20" width="360" height="290" rx="10" ry="10"
        fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <!-- Gold header bar -->
  <rect x="260" y="20" width="360" height="42" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="260" y="42" width="360" height="20" fill="#FFB81C"/>
  <text x="440" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#00294D">
    🛡️  Prisma AIRS AI Runtime Firewall
  </text>

  <!-- Cloud-Delivered Security label -->
  <rect x="285" y="75" width="310" height="24" rx="4" ry="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="440" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">
    Cloud-Delivered Security
  </text>

  <!-- AI Security Profile sub-box -->
  <rect x="285" y="108" width="200" height="135" rx="6" ry="6"
        fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="295" y="126" font-size="11" font-weight="700" fill="#00294D">AI Security Profile</text>

  <text x="305" y="146" font-size="10.5" fill="#333">├ Prompt Injection</text>
  <text x="305" y="162" font-size="10.5" fill="#333">├ Toxic Content</text>
  <text x="305" y="178" font-size="10.5" fill="#333">├ URL Categorization</text>
  <text x="305" y="194" font-size="10.5" fill="#333">├ DLP / Data Protection</text>
  <text x="305" y="210" font-size="10.5" fill="#333">├ Database Security</text>
  <text x="305" y="226" font-size="10.5" fill="#333">└ Model Access Control</text>

  <!-- Additional services box -->
  <rect x="500" y="108" width="95" height="135" rx="6" ry="6"
        fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="548" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#666">ALSO INCLUDED</text>
  <text x="510" y="150" font-size="10" fill="#333">ATP</text>
  <text x="510" y="167" font-size="10" fill="#333">WildFire</text>
  <text x="510" y="184" font-size="10" fill="#333">DNS Security</text>
  <text x="510" y="201" font-size="10" fill="#333">Adv URL</text>
  <text x="510" y="218" font-size="10" fill="#333">Filtering</text>

  <!-- Inspection zone label -->
  <rect x="300" y="258" width="280" height="28" rx="4" ry="4" fill="#e7f3ff" stroke="none"/>
  <text x="440" y="277" text-anchor="middle" font-size="10.5" font-weight="600" fill="#006DCC">
    Inline Inspection — No App Code Changes
  </text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TRAFFIC SOURCES (LEFT SIDE)                      -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Traffic type 1: User-to-App -->
  <rect x="30" y="115" width="150" height="60" rx="8" ry="8"
        fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="105" y="141" text-anchor="middle" font-size="22">👤</text>
  <text x="105" y="163" text-anchor="middle" font-size="11" font-weight="600" fill="#00294D">Users</text>

  <!-- Label 1 -->
  <rect x="52" y="96" width="106" height="18" rx="9" ry="9" fill="#FFB81C"/>
  <text x="105" y="109" text-anchor="middle" font-size="9.5" font-weight="700" fill="#00294D">1 · User-to-App</text>

  <!-- Bidirectional arrow 1 -->
  <line x1="180" y1="138" x2="258" y2="138" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-r-gold)"/>
  <line x1="258" y1="152" x2="180" y2="152" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-l-gold)"/>

  <!-- Traffic type 2: App-to-App -->
  <rect x="30" y="240" width="150" height="70" rx="8" ry="8"
        fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="58" y="268" font-size="11" font-weight="600" fill="#00294D">App A</text>
  <text x="58" y="296" font-size="11" font-weight="600" fill="#00294D">App B</text>
  <line x1="50" y1="277" x2="160" y2="277" stroke="#dee2e6" stroke-width="1"/>
  <text x="140" y="268" font-size="16">⚙️</text>
  <text x="140" y="296" font-size="16">⚙️</text>

  <!-- Label 2 -->
  <rect x="52" y="221" width="106" height="18" rx="9" ry="9" fill="#FFB81C"/>
  <text x="105" y="234" text-anchor="middle" font-size="9.5" font-weight="700" fill="#00294D">2 · App-to-App</text>

  <!-- Bidirectional arrow 2 -->
  <line x1="180" y1="268" x2="258" y2="210" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-r-gold)"/>
  <line x1="258" y1="220" x2="180" y2="282" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-l-gold)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TRAFFIC DESTINATIONS (RIGHT SIDE)                -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Traffic type 3: App-to-Model -->
  <rect x="700" y="100" width="150" height="100" rx="8" ry="8"
        fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="775" y="126" text-anchor="middle" font-size="20">🤖</text>
  <text x="775" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#00294D">AI Models</text>
  <text x="775" y="165" text-anchor="middle" font-size="9.5" fill="#666">Bedrock · Vertex AI</text>
  <text x="775" y="180" text-anchor="middle" font-size="9.5" fill="#666">Azure OpenAI · Custom</text>

  <!-- Label 3 -->
  <rect x="714" y="80" width="122" height="18" rx="9" ry="9" fill="#FFB81C"/>
  <text x="775" y="93" text-anchor="middle" font-size="9.5" font-weight="700" fill="#00294D">3 · App-to-Model</text>

  <!-- Bidirectional arrow 3 -->
  <line x1="622" y1="140" x2="698" y2="140" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-r-gold)"/>
  <line x1="698" y1="158" x2="622" y2="158" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-l-gold)"/>

  <!-- Traffic type 4: App-to-Internet -->
  <rect x="700" y="240" width="150" height="60" rx="8" ry="8"
        fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="775" y="266" text-anchor="middle" font-size="20">🌐</text>
  <text x="775" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#666">Internet</text>

  <!-- Label 4 -->
  <rect x="702" y="221" width="140" height="18" rx="9" ry="9" fill="#FFB81C"/>
  <text x="772" y="234" text-anchor="middle" font-size="9.5" font-weight="700" fill="#00294D">4 · App-to-Internet</text>

  <!-- Arrow 4 (outbound primarily) -->
  <line x1="622" y1="258" x2="698" y2="258" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-r-gold)"/>
  <line x1="698" y1="274" x2="622" y2="274" stroke="#E5A300" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-l-gold)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STRATA CLOUD MANAGER (BOTTOM)                    -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="320" y="350" width="240" height="60" rx="10" ry="10"
        fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">
    Strata Cloud Manager
  </text>
  <text x="440" y="396" text-anchor="middle" font-size="10.5" fill="#666">
    Logs  ·  Discovery  ·  Policy
  </text>

  <!-- Downward arrow from firewall to SCM -->
  <line x1="440" y1="312" x2="440" y2="348" stroke="#006DCC" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow-down)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  FOUR TRAFFIC TYPES LEGEND (BOTTOM)               -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="440" width="820" height="160" rx="8" ry="8"
        fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="440" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">
    Four Traffic Types Inspected
  </text>

  <!-- Type 1 -->
  <rect x="50" y="476" width="185" height="56" rx="6" ry="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="50" y="476" width="185" height="4" rx="2" ry="2" fill="#FFB81C"/>
  <text x="142" y="497" text-anchor="middle" font-size="10" font-weight="700" fill="#00294D">1 · User-to-App</text>
  <text x="142" y="513" text-anchor="middle" font-size="9" fill="#666">Inbound traffic from end</text>
  <text x="142" y="525" text-anchor="middle" font-size="9" fill="#666">users to AI-powered apps</text>

  <!-- Type 2 -->
  <rect x="255" y="476" width="185" height="56" rx="6" ry="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="255" y="476" width="185" height="4" rx="2" ry="2" fill="#FFB81C"/>
  <text x="347" y="497" text-anchor="middle" font-size="10" font-weight="700" fill="#00294D">2 · App-to-App</text>
  <text x="347" y="513" text-anchor="middle" font-size="9" fill="#666">East-west traffic between</text>
  <text x="347" y="525" text-anchor="middle" font-size="9" fill="#666">services (incl. containers)</text>

  <!-- Type 3 -->
  <rect x="460" y="476" width="185" height="56" rx="6" ry="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="460" y="476" width="185" height="4" rx="2" ry="2" fill="#FFB81C"/>
  <text x="552" y="497" text-anchor="middle" font-size="10" font-weight="700" fill="#00294D">3 · App-to-Model</text>
  <text x="552" y="513" text-anchor="middle" font-size="9" fill="#666">Traffic to AI model endpoints</text>
  <text x="552" y="525" text-anchor="middle" font-size="9" fill="#666">(Bedrock, Vertex, Azure OAI)</text>

  <!-- Type 4 -->
  <rect x="665" y="476" width="165" height="56" rx="6" ry="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="665" y="476" width="165" height="4" rx="2" ry="2" fill="#FFB81C"/>
  <text x="747" y="497" text-anchor="middle" font-size="10" font-weight="700" fill="#00294D">4 · App-to-Internet</text>
  <text x="747" y="513" text-anchor="middle" font-size="9" fill="#666">Outbound traffic to</text>
  <text x="747" y="525" text-anchor="middle" font-size="9" fill="#666">external services</text>

  <!-- Key insight -->
  <rect x="50" y="548" width="800" height="38" rx="6" ry="6" fill="#e7f3ff" stroke="none"/>
  <text x="440" y="570" text-anchor="middle" font-size="10.5" fill="#006DCC">
    ℹ️  Network Intercept operates at the network layer — no application code changes required. Protects apps you own, third-party, legacy, and SaaS.
  </text>

</svg>
