<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="ad" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#00294D"/>
    </marker>
    <marker id="ad-blue" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#006DCC"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  KUBERNETES CLUSTER CONTAINER                     -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="40" y="16" width="600" height="270" rx="10" ry="10"
        fill="none" stroke="#006DCC" stroke-width="2.5"/>

  <!-- Cluster header -->
  <rect x="40" y="16" width="600" height="36" rx="10" ry="10" fill="#006DCC"/>
  <rect x="40" y="36" width="600" height="16" fill="#006DCC"/>
  <text x="340" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">
    ☸  Kubernetes Cluster
  </text>

  <!-- App Pod 1 -->
  <rect x="120" y="68" width="140" height="55" rx="8" ry="8"
        fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="190" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#00294D">App Pod</text>
  <text x="190" y="108" text-anchor="middle" font-size="9" fill="#16a34a">annotated ✓</text>

  <!-- App Pod 2 -->
  <rect x="420" y="68" width="140" height="55" rx="8" ry="8"
        fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="490" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#00294D">App Pod</text>
  <text x="490" y="108" text-anchor="middle" font-size="9" fill="#16a34a">annotated ✓</text>

  <!-- Arrows from pods to CNI -->
  <line x1="190" y1="125" x2="190" y2="155" stroke="#00294D" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ad)"/>
  <line x1="490" y1="125" x2="490" y2="155" stroke="#00294D" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ad)"/>

  <!-- PAN-CNI DaemonSet -->
  <rect x="100" y="160" width="480" height="55" rx="8" ry="8"
        fill="#fffbeb" stroke="#E5A300" stroke-width="2"/>
  <text x="340" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">
    PAN-CNI DaemonSet
  </text>
  <text x="340" y="203" text-anchor="middle" font-size="10" fill="#666">
    Redirects annotated pod traffic to firewall  ·  kube-system namespace
  </text>

  <!-- Arrow from CNI out of cluster -->
  <line x1="340" y1="217" x2="340" y2="260" stroke="#00294D" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ad)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  AIRS FIREWALL                                    -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="100" y="305" width="480" height="90" rx="10" ry="10"
        fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <!-- Gold header -->
  <rect x="100" y="305" width="480" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="100" y="325" width="480" height="16" fill="#FFB81C"/>
  <text x="340" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">
    🛡️  AIRS AI Runtime Firewall
  </text>

  <!-- Security profile summary -->
  <rect x="120" y="350" width="440" height="32" rx="6" ry="6"
        fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="371" text-anchor="middle" font-size="10.5" fill="#333">
    AI Security Profile  ·  Prompt Injection  ·  DLP  ·  Toxic Content  ·  Cloud-Delivered Security
  </text>

  <!-- Arrow from firewall to destinations -->
  <line x1="340" y1="397" x2="340" y2="435" stroke="#00294D" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#ad)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  DESTINATIONS                                     -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="200" y="440" width="280" height="50" rx="8" ry="8"
        fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="340" y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#00294D">
    🤖  AI Models  /  🌐  Internet
  </text>
  <text x="340" y="480" text-anchor="middle" font-size="9.5" fill="#666">
    Bedrock  ·  Vertex AI  ·  Azure OAI
  </text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PROTECTION LEVEL BADGES (RIGHT SIDE)             -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="610" y="80" width="60" height="125" rx="6" ry="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="640" y="100" text-anchor="middle" font-size="8.5" font-weight="600" fill="#666">LEVELS</text>
  <rect x="618" y="110" width="44" height="32" rx="4" ry="4" fill="#e7f3ff" stroke="#006DCC" stroke-width="1"/>
  <text x="640" y="130" text-anchor="middle" font-size="8" font-weight="600" fill="#006DCC">VPC</text>
  <rect x="618" y="152" width="44" height="40" rx="4" ry="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="640" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="#16a34a">Name-</text>
  <text x="640" y="182" text-anchor="middle" font-size="8" font-weight="600" fill="#16a34a">space</text>

</svg>
