<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="tc-ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A300"/>
    </marker>
    <marker id="tc-ar-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#006DCC"/>
    </marker>
    <marker id="tc-ar-r2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PRIVATE K8S CLUSTER (LEFT)                       -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="30" width="210" height="170" rx="10" ry="10"
        fill="#fff" stroke="#006DCC" stroke-width="2"/>

  <rect x="30" y="30" width="210" height="34" rx="10" ry="10" fill="#006DCC"/>
  <rect x="30" y="48" width="210" height="16" fill="#006DCC"/>
  <text x="135" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">
    ☸  Private K8s Cluster
  </text>

  <text x="60" y="88" font-size="10.5" fill="#333">Private API Server</text>
  <rect x="50" y="74" width="170" height="22" rx="4" ry="4" fill="none" stroke="#dee2e6" stroke-width="1"/>

  <text x="60" y="122" font-size="10.5" fill="#333">Pods / Services</text>
  <rect x="50" y="108" width="170" height="22" rx="4" ry="4" fill="none" stroke="#dee2e6" stroke-width="1"/>

  <text x="60" y="156" font-size="10.5" fill="#333">Namespaces / Labels</text>
  <rect x="50" y="142" width="170" height="22" rx="4" ry="4" fill="none" stroke="#dee2e6" stroke-width="1"/>

  <!-- No public endpoint badge -->
  <rect x="55" y="175" width="160" height="18" rx="4" ry="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="135" y="188" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">🔒 No public API endpoint</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TAG COLLECTOR AGENT (CENTER)                     -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="310" y="30" width="200" height="170" rx="10" ry="10"
        fill="#fff" stroke="#E5A300" stroke-width="2"/>

  <rect x="310" y="30" width="200" height="34" rx="10" ry="10" fill="#E5A300"/>
  <rect x="310" y="48" width="200" height="16" fill="#E5A300"/>
  <text x="410" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">
    🏷️  Tag Collector Agent
  </text>

  <text x="330" y="84" font-size="10.5" fill="#333">Polls K8s API</text>
  <text x="330" y="104" font-size="10.5" fill="#333">Harvests IP-tag mappings</text>
  <text x="330" y="124" font-size="10.5" fill="#333">Redistributes via CIE</text>

  <rect x="325" y="140" width="170" height="22" rx="4" ry="4" fill="#fffbeb" stroke="#E5A300" stroke-width="1"/>
  <text x="410" y="155" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b45309">PAN-OS 11.2.10+</text>

  <rect x="325" y="168" width="170" height="22" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="410" y="183" text-anchor="middle" font-size="9" fill="#666">Separate FW instance</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  AIRS FIREWALL (RIGHT)                            -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="580" y="30" width="210" height="170" rx="10" ry="10"
        fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <rect x="580" y="30" width="210" height="34" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="580" y="48" width="210" height="16" fill="#FFB81C"/>
  <text x="685" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">
    🛡️  AIRS Firewall
  </text>

  <text x="605" y="84" font-size="10.5" fill="#333">Receives tags via CIE</text>
  <text x="605" y="104" font-size="10.5" fill="#333">Creates Dynamic</text>
  <text x="605" y="120" font-size="10.5" fill="#333">Address Groups (DAGs)</text>
  <text x="605" y="144" font-size="10.5" fill="#333">Enforces policy based</text>
  <text x="605" y="160" font-size="10.5" fill="#333">on K8s context</text>

  <rect x="595" y="168" width="180" height="22" rx="4" ry="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="685" y="183" text-anchor="middle" font-size="9.5" font-weight="600" fill="#16a34a">IP → Tag → DAG → Policy</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  ARROWS BETWEEN COMPONENTS                        -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Cluster → Tag Collector (polls) -->
  <line x1="242" y1="100" x2="308" y2="100" stroke="#006DCC" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#tc-ar-l)"/>
  <text x="275" y="92" text-anchor="middle" font-size="8.5" fill="#006DCC">Polls API</text>

  <!-- Tag Collector → Firewall (distributes tags) -->
  <line x1="512" y1="100" x2="578" y2="100" stroke="#22c55e" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#tc-ar-r2)"/>
  <text x="545" y="92" text-anchor="middle" font-size="8.5" fill="#16a34a">Tags</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TGW / VNET PEERING (BOTTOM)                      -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="140" y="240" width="540" height="50" rx="8" ry="8"
        fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="410" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#00294D">
    TGW  /  VNet Peering
  </text>
  <text x="410" y="280" text-anchor="middle" font-size="9.5" fill="#666">
    Private connectivity between cluster VPC/VNet and firewall VPC/VNet
  </text>

  <!-- Dashed lines from cluster and tag collector down to peering -->
  <line x1="135" y1="202" x2="250" y2="238" stroke="#999" stroke-width="1.5"
        stroke-dasharray="4,3"/>
  <line x1="410" y1="202" x2="410" y2="238" stroke="#999" stroke-width="1.5"
        stroke-dasharray="4,3"/>
  <line x1="685" y1="202" x2="570" y2="238" stroke="#999" stroke-width="1.5"
        stroke-dasharray="4,3"/>

  <!-- AWS + Azure only badge -->
  <rect x="305" y="296" width="210" height="18" rx="4" ry="4" fill="#fffbeb" stroke="#E5A300" stroke-width="1"/>
  <text x="410" y="309" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">⚠️ AWS and Azure private clusters only</text>

</svg>
