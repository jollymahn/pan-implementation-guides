<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="hp-ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A300"/>
    </marker>
    <marker id="hp-ar-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  LINUX WORKLOAD (LEFT)                            -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="30" width="310" height="280" rx="10" ry="10"
        fill="#fff" stroke="#006DCC" stroke-width="2.5"/>

  <!-- Header -->
  <rect x="30" y="30" width="310" height="36" rx="10" ry="10" fill="#006DCC"/>
  <rect x="30" y="50" width="310" height="16" fill="#006DCC"/>
  <text x="185" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">
    🖥️  Linux Workload
  </text>

  <!-- Application box -->
  <rect x="100" y="80" width="170" height="40" rx="6" ry="6"
        fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="185" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#00294D">Application</text>

  <!-- Arrow down -->
  <line x1="185" y1="122" x2="185" y2="140" stroke="#00294D" stroke-width="1.5"/>
  <polygon points="180,140 190,140 185,148" fill="#00294D"/>

  <!-- panredirect agent -->
  <rect x="70" y="150" width="230" height="45" rx="6" ry="6"
        fill="#fffbeb" stroke="#E5A300" stroke-width="2"/>
  <text x="185" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">panredirect agent</text>
  <text x="185" y="188" text-anchor="middle" font-size="9.5" fill="#666">Intercepts inbound + outbound packets</text>

  <!-- Arrow down -->
  <line x1="185" y1="197" x2="185" y2="212" stroke="#00294D" stroke-width="1.5"/>
  <polygon points="180,212 190,212 185,220" fill="#00294D"/>

  <!-- pangnv0 interface -->
  <rect x="100" y="222" width="170" height="45" rx="6" ry="6"
        fill="#e7f3ff" stroke="#006DCC" stroke-width="1.5"/>
  <text x="185" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">pangnv0</text>
  <text x="185" y="260" text-anchor="middle" font-size="9.5" fill="#666">MTU 1440  ·  GENEVE IF</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PRISMA AIRS FIREWALL (RIGHT)                     -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="480" y="30" width="310" height="280" rx="10" ry="10"
        fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <!-- Gold header -->
  <rect x="480" y="30" width="310" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="480" y="50" width="310" height="16" fill="#FFB81C"/>
  <text x="635" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">
    🛡️  Prisma AIRS Firewall
  </text>

  <!-- L7 Security Engine -->
  <rect x="510" y="82" width="250" height="130" rx="8" ry="8"
        fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="635" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">L7 Security Engine</text>

  <!-- Steps inside engine -->
  <rect x="530" y="114" width="210" height="26" rx="4" ry="4" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="545" cy="127" r="9" fill="#00294D"/>
  <text x="545" y="131" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
  <text x="565" y="131" font-size="10.5" fill="#333">Decapsulate GENEVE</text>

  <rect x="530" y="146" width="210" height="26" rx="4" ry="4" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="545" cy="159" r="9" fill="#006DCC"/>
  <text x="545" y="163" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
  <text x="565" y="163" font-size="10.5" fill="#333">L7 Inspect (AI Security)</text>

  <rect x="530" y="178" width="210" height="26" rx="4" ry="4" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="545" cy="191" r="9" fill="#22c55e"/>
  <text x="545" y="195" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
  <text x="565" y="195" font-size="10.5" fill="#333">Re-encapsulate</text>

  <!-- Data Interface info -->
  <rect x="510" y="228" width="250" height="60" rx="6" ry="6"
        fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="535" y="249" font-size="10.5" font-weight="600" fill="#00294D">Data Interface (L3)</text>
  <text x="535" y="266" font-size="10" fill="#666">Static IPv4  ·  Dedicated Zone/VR</text>
  <text x="535" y="281" font-size="10" fill="#666">GENEVE decap/encap endpoint</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  GENEVE TUNNEL ARROWS (BETWEEN)                   -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Forward arrow: Workload → Firewall (GENEVE encap) -->
  <line x1="342" y1="165" x2="478" y2="130" stroke="#E5A300" stroke-width="2.5"
        stroke-dasharray="8,4" marker-end="url(#hp-ar-r)"/>

  <!-- Label on forward arrow -->
  <rect x="360" y="126" width="110" height="30" rx="5" ry="5" fill="#fffbeb" stroke="#E5A300" stroke-width="1"/>
  <text x="415" y="140" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">GENEVE Tunnel</text>
  <text x="415" y="152" text-anchor="middle" font-size="9" fill="#b45309">UDP 6081 →</text>

  <!-- Return arrow: Firewall → Workload (inspected traffic) -->
  <line x1="478" y1="200" x2="342" y2="238" stroke="#22c55e" stroke-width="2.5"
        stroke-dasharray="8,4" marker-end="url(#hp-ar-l)"/>

  <!-- Label on return arrow -->
  <rect x="360" y="206" width="110" height="30" rx="5" ry="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="415" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#16a34a">← Inspected</text>
  <text x="415" y="232" text-anchor="middle" font-size="9" fill="#16a34a">Traffic Return</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  BOTTOM CALLOUT                                   -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="330" width="760" height="36" rx="6" ry="6" fill="#e7f3ff" stroke="none"/>
  <text x="410" y="353" text-anchor="middle" font-size="10.5" fill="#006DCC">
    ℹ️  Hairpin pattern — traffic leaves the workload, is inspected by the firewall, and returns to the same workload for delivery.
  </text>

</svg>
