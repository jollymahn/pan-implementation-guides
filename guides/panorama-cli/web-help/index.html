<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panorama Web Help Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --pan-gold: #FFB81C;
  --pan-gold-dark: #E5A300;
  --pan-navy: #00294D;
  --pan-link: #006DCC;
  --pan-link-hover: #004C99;
  --fg: #333333;
  --fg-light: #666666;
  --border: #dee2e6;
  --code-bg: #f8f9fa;
  --sidebar-bg: #f7f8fa;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Lato', sans-serif;
  color: var(--fg);
  background: #fff;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* --- Sidebar --- */
.sidebar {
  width: 320px;
  min-width: 320px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.sidebar-header {
  background: var(--pan-gold);
  padding: 16px 20px;
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--pan-navy);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.sidebar-header p {
  font-size: 12px;
  color: var(--pan-navy);
  opacity: 0.8;
  margin-top: 2px;
}

.search-box {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: 'Lato', sans-serif;
  font-size: 14px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--pan-link);
  box-shadow: 0 0 0 2px rgba(0, 109, 204, 0.15);
}

.search-count {
  font-size: 11px;
  color: var(--fg-light);
  margin-top: 6px;
}

.tree-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.tree-item {
  display: flex;
  align-items: center;
  padding: 5px 16px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.4;
  color: var(--fg);
  border-left: 3px solid transparent;
  transition: background 0.1s;
}

.tree-item:hover {
  background: rgba(0, 109, 204, 0.06);
}

.tree-item.active {
  background: rgba(0, 109, 204, 0.1);
  border-left-color: var(--pan-link);
  font-weight: 600;
}

.tree-item.section {
  font-weight: 700;
  color: var(--pan-navy);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding-top: 12px;
  padding-bottom: 6px;
  cursor: pointer;
}

.tree-item.section:hover {
  background: rgba(0, 41, 77, 0.05);
}

.tree-toggle {
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--fg-light);
  flex-shrink: 0;
  margin-right: 4px;
  transition: transform 0.15s;
  user-select: none;
}

.tree-toggle.expanded {
  transform: rotate(90deg);
}

.tree-text {
  flex: 1;
  min-width: 0;
}

.tree-item.hidden {
  display: none;
}

.tree-item .highlight {
  background: #fff3cd;
  border-radius: 2px;
  padding: 0 1px;
}

/* --- Content --- */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-header {
  background: var(--pan-navy);
  color: #fff;
  padding: 12px 32px;
  font-size: 13px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.content-header .breadcrumb {
  opacity: 0.8;
}

.content-header .file-path {
  font-family: 'Source Code Pro', monospace;
  font-size: 12px;
  opacity: 0.6;
}

.content-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px;
  max-width: 900px;
}

.content-body.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--fg-light);
}

.content-body.welcome h2 {
  color: var(--pan-navy);
  font-size: 22px;
  margin-bottom: 8px;
}

.content-body.welcome p {
  font-size: 14px;
  max-width: 400px;
  line-height: 1.6;
}

.content-body.welcome .stats {
  display: flex;
  gap: 32px;
  margin-top: 24px;
}

.content-body.welcome .stat {
  text-align: center;
}

.content-body.welcome .stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--pan-navy);
}

.content-body.welcome .stat-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Markdown rendering */
.md-content h1 {
  font-size: 24px;
  color: var(--pan-navy);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 3px solid var(--pan-gold);
}

.md-content h2 {
  font-size: 20px;
  color: var(--pan-navy);
  margin-top: 28px;
  margin-bottom: 12px;
}

.md-content h3 {
  font-size: 16px;
  color: var(--pan-navy);
  margin-top: 20px;
  margin-bottom: 8px;
}

.md-content p {
  margin-bottom: 12px;
  line-height: 1.7;
  font-size: 14px;
}

.md-content ul, .md-content ol {
  margin-bottom: 12px;
  padding-left: 24px;
}

.md-content li {
  margin-bottom: 6px;
  line-height: 1.6;
  font-size: 14px;
}

.md-content code {
  font-family: 'Source Code Pro', monospace;
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 13px;
}

.md-content pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
  overflow-x: auto;
  margin-bottom: 16px;
}

.md-content pre code {
  background: none;
  padding: 0;
}

.md-content table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 16px;
  font-size: 13px;
}

.md-content table th {
  background: var(--pan-navy);
  color: #fff;
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
}

.md-content table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}

.md-content table tr:nth-child(even) td {
  background: var(--sidebar-bg);
}

.md-content a {
  color: var(--pan-link);
  text-decoration: none;
}

.md-content a:hover {
  color: var(--pan-link-hover);
  text-decoration: underline;
}

.md-content blockquote {
  border-left: 4px solid var(--pan-gold);
  padding: 12px 16px;
  margin-bottom: 12px;
  background: #fffbf0;
}

.md-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

.loading {
  color: var(--fg-light);
  font-style: italic;
  padding: 20px;
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Panorama Web Help</h1>
    <p>PAN-OS 12.1 Reference</p>
  </div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search topics..." autocomplete="off">
    <div class="search-count" id="search-count">624 topics</div>
  </div>
  <div class="tree-container" id="tree"></div>
</div>

<div class="content">
  <div class="content-header">
    <span class="breadcrumb" id="breadcrumb">Panorama Web Help</span>
    <span class="file-path" id="file-path"></span>
  </div>
  <div class="content-body welcome" id="content">
    <h2>Panorama Web Help Reference</h2>
    <p>624 help pages scraped from the Panorama management interface, converted to searchable markdown.</p>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">624</div>
        <div class="stat-label">Topics</div>
      </div>
      <div class="stat">
        <div class="stat-num">11</div>
        <div class="stat-label">Sections</div>
      </div>
      <div class="stat">
        <div class="stat-num">2.4</div>
        <div class="stat-label">MB</div>
      </div>
    </div>
  </div>
</div>

<!-- NOTE: This page renders only local, trusted markdown files from the scraped
     Panorama web help. No user-supplied or external content is rendered. -->
<script src="panorama-help-browser.js"></script>

</body>
</html>
