<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panorama Web Help &mdash; PAN-OS 12.1</title>
<link rel="stylesheet" href="assets/css/_!pan-os-web-interface-help.css" type="text/css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 320px;
  min-width: 320px;
  background: #f5f5f5;
  border-right: 1px solid #ccc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.sidebar-header {
  background: #333;
  color: #fff;
  padding: 12px 16px;
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 14px;
  font-weight: bold;
}

.sidebar-header p {
  font-size: 11px;
  color: #aaa;
  margin-top: 2px;
}

.search-box {
  padding: 8px 12px;
  border-bottom: 1px solid #ccc;
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid #ccc;
  font-size: 13px;
}

.search-count {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
}

.tree-container {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.tree-item {
  display: flex;
  align-items: flex-start;
  padding: 3px 8px;
  cursor: pointer;
  font-size: 12px;
  line-height: 1.4;
  color: #333;
}

.tree-item:hover { background: #e8e8e8; }
.tree-item.active { background: #d0d8e8; font-weight: bold; }

.tree-item.section {
  font-weight: bold;
  color: #222;
  padding-top: 10px;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.3px;
}

.tree-toggle {
  width: 14px;
  font-size: 9px;
  color: #666;
  flex-shrink: 0;
  margin-right: 3px;
  margin-top: 2px;
  user-select: none;
  transition: transform 0.1s;
}

.tree-toggle.expanded { transform: rotate(90deg); }

.tree-text { flex: 1; }

.tree-item.hidden { display: none; }

.tree-item .highlight {
  background: #ff9;
  padding: 0 1px;
}

.content {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.content iframe {
  flex: 1;
  border: none;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Panorama Web Help</h1>
    <p>PAN-OS 12.1 &mdash; Offline Reference</p>
  </div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search topics...">
    <div class="search-count" id="search-count">624 topics</div>
  </div>
  <div class="tree-container" id="tree"></div>
</div>

<div class="content">
  <iframe id="viewer" src="web-interface-basics.html"></iframe>
</div>

<script src="tree-data.json.js"></script>
<script src="help-browser.js"></script>

</body>
</html>
