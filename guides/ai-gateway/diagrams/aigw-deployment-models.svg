<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="Lato, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#006DCC"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="500" fill="#ffffff"/>

  <!-- Control plane -->
  <rect x="235" y="20" width="450" height="66" rx="8" fill="#fff7e6" stroke="#FFB81C" stroke-width="2"/>
  <text x="460" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#00294D">Strata Cloud Manager</text>
  <text x="460" y="70" text-anchor="middle" font-size="12.5" fill="#333333">One control plane manages both deployment models</text>

  <line x1="340" y1="86" x2="240" y2="140" stroke="#006DCC" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue2)"/>
  <line x1="580" y1="86" x2="680" y2="140" stroke="#006DCC" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue2)"/>

  <!-- SaaS panel -->
  <rect x="40" y="144" width="400" height="280" rx="8" fill="#f7f8fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="240" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#00294D">SaaS (Default)</text>
  <rect x="70" y="192" width="340" height="92" rx="8" fill="#e7f3ff" stroke="#00294D" stroke-width="2"/>
  <text x="240" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#00294D">Data Plane</text>
  <text x="240" y="244" text-anchor="middle" font-size="12.5" fill="#333333">Hosted and operated by Palo Alto Networks</text>
  <text x="240" y="264" text-anchor="middle" font-size="12.5" fill="#333333">Enabled by default after licensing</text>
  <text x="70" y="316" font-size="12.5" fill="#333333">&#8226;  Setup required: none</text>
  <text x="70" y="342" font-size="12.5" fill="#333333">&#8226;  Scale: unlimited, cloud-hosted</text>
  <text x="70" y="368" font-size="12.5" fill="#333333">&#8226;  High availability: built in</text>
  <text x="70" y="394" font-size="12.5" fill="#333333">&#8226;  Route traffic immediately after activation</text>

  <!-- Hybrid panel -->
  <rect x="480" y="144" width="400" height="280" rx="8" fill="#f7f8fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="680" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#00294D">Hybrid</text>
  <rect x="510" y="192" width="340" height="92" rx="8" fill="#e7f3ff" stroke="#00294D" stroke-width="2"/>
  <text x="680" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#00294D">Data Plane in Your Kubernetes Cluster</text>
  <rect x="526" y="230" width="96" height="40" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="574" y="247" text-anchor="middle" font-size="11" fill="#333333">Pods</text>
  <text x="574" y="262" text-anchor="middle" font-size="11" fill="#666666">Zone A</text>
  <rect x="632" y="230" width="96" height="40" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="680" y="247" text-anchor="middle" font-size="11" fill="#333333">Pods</text>
  <text x="680" y="262" text-anchor="middle" font-size="11" fill="#666666">Zone B</text>
  <rect x="738" y="230" width="96" height="40" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="786" y="247" text-anchor="middle" font-size="11" fill="#333333">Pods</text>
  <text x="786" y="262" text-anchor="middle" font-size="11" fill="#666666">Zone C</text>
  <text x="510" y="316" font-size="12.5" fill="#333333">&#8226;  Setup: deploy container with Helm charts</text>
  <text x="510" y="342" font-size="12.5" fill="#333333">&#8226;  Scale: set by Data Plane CPU and memory</text>
  <text x="510" y="368" font-size="12.5" fill="#333333">&#8226;  HA: pods auto-distributed across zones</text>
  <text x="510" y="394" font-size="12.5" fill="#333333">&#8226;  Any public cloud, private cloud, on-prem K8s</text>

  <!-- Pricing note -->
  <rect x="235" y="444" width="450" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="460" y="469" text-anchor="middle" font-size="12.5" fill="#333333">Identical pricing for both models &#183; no extra cost for multiple gateways</text>
</svg>
