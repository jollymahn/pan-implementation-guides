<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Lato, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00294D"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#006DCC"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <!-- Control plane -->
  <rect x="210" y="20" width="500" height="88" rx="8" fill="#fff7e6" stroke="#FFB81C" stroke-width="2"/>
  <text x="460" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#00294D">Strata Cloud Manager (Control Plane)</text>
  <text x="460" y="72" text-anchor="middle" font-size="12.5" fill="#333333">Licensing (flex credits)  &#183;  Workspaces + SBAC  &#183;  Integrations  &#183;  Dashboards</text>
  <text x="460" y="92" text-anchor="middle" font-size="12.5" fill="#666666">Organization = TSG  &#183;  Workspace = SCM Workspace</text>

  <!-- SCM manages arrow -->
  <line x1="460" y1="108" x2="460" y2="180" stroke="#006DCC" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <text x="472" y="150" font-size="12" fill="#006DCC">manages</text>

  <!-- Sources -->
  <rect x="30" y="200" width="220" height="170" rx="8" fill="#f7f8fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="140" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#00294D">AI Applications &amp; Agents</text>
  <rect x="50" y="244" width="180" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="140" y="264" text-anchor="middle" font-size="12.5" fill="#333333">Applications (LLM prompts)</text>
  <rect x="50" y="282" width="180" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="140" y="302" text-anchor="middle" font-size="12.5" fill="#333333">AI agents (A2A)</text>
  <rect x="50" y="320" width="180" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="140" y="340" text-anchor="middle" font-size="12.5" fill="#333333">MCP clients</text>

  <!-- Gateway -->
  <rect x="310" y="188" width="300" height="196" rx="8" fill="#e7f3ff" stroke="#00294D" stroke-width="2"/>
  <text x="460" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#00294D">Prisma AIRS AI Gateway</text>
  <text x="460" y="234" text-anchor="middle" font-size="12" fill="#666666">Data Plane &#183; SaaS or Hybrid (your K8s)</text>
  <rect x="330" y="246" width="126" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="393" y="266" text-anchor="middle" font-size="12" fill="#333333">Guardrails</text>
  <rect x="464" y="246" width="126" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="527" y="266" text-anchor="middle" font-size="12" fill="#333333">Model allowlists</text>
  <rect x="330" y="284" width="126" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="393" y="304" text-anchor="middle" font-size="12" fill="#333333">Budgets + rate limits</text>
  <rect x="464" y="284" width="126" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="527" y="304" text-anchor="middle" font-size="12" fill="#333333">Observability</text>
  <rect x="330" y="322" width="260" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="460" y="342" text-anchor="middle" font-size="12" fill="#333333">Token metering (1 token = 4 characters)</text>

  <!-- Destinations -->
  <rect x="670" y="200" width="220" height="170" rx="8" fill="#f7f8fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="780" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#00294D">Model Endpoints</text>
  <rect x="690" y="244" width="180" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="780" y="264" text-anchor="middle" font-size="12.5" fill="#333333">LLM providers</text>
  <rect x="690" y="282" width="180" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="780" y="302" text-anchor="middle" font-size="12.5" fill="#333333">MCP servers</text>
  <rect x="690" y="320" width="180" height="30" rx="5" fill="#ffffff" stroke="#dee2e6"/>
  <text x="780" y="340" text-anchor="middle" font-size="12.5" fill="#333333">Private models (custom host)</text>

  <!-- Traffic arrows -->
  <line x1="250" y1="285" x2="310" y2="285" stroke="#00294D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="305" x2="250" y2="305" stroke="#00294D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="285" x2="670" y2="285" stroke="#00294D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="305" x2="610" y2="305" stroke="#00294D" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Logging arrows -->
  <line x1="380" y1="384" x2="250" y2="452" stroke="#006DCC" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="384" x2="670" y2="452" stroke="#006DCC" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlue)"/>

  <!-- Event logs -->
  <rect x="40" y="456" width="400" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#00294D">Event Logs (structured, real time)</text>
  <text x="240" y="504" text-anchor="middle" font-size="12" fill="#333333">Audit &#183; authentication &#183; traffic &#183; metrics</text>
  <text x="240" y="524" text-anchor="middle" font-size="12" fill="#333333">AI Gateway dashboard &#183; SLS Threat Logs</text>
  <text x="240" y="544" text-anchor="middle" font-size="12" fill="#333333">OpenTelemetry export to SIEM / SOAR</text>
  <text x="240" y="564" text-anchor="middle" font-size="12" fill="#666666">Retention: 1 year</text>

  <!-- Prompt logs -->
  <rect x="480" y="456" width="400" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="680" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#00294D">Prompt Logs (full LLM context)</text>
  <text x="680" y="504" text-anchor="middle" font-size="12" fill="#333333">Performance analysis &#183; cost tracking &#183; compliance</text>
  <text x="680" y="524" text-anchor="middle" font-size="12" fill="#333333">AI Gateway dashboard (native storage)</text>
  <text x="680" y="544" text-anchor="middle" font-size="12" fill="#333333">Export to customer-owned S3 (Hybrid only)</text>
  <text x="680" y="564" text-anchor="middle" font-size="12" fill="#666666">Retention: 1 year</text>
</svg>
