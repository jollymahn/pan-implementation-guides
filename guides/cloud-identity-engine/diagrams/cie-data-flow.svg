<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="df-ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00294D"/>
    </marker>
    <marker id="df-ar-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A300"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TITLE                                            -->
  <!-- ══════════════════════════════════════════════════ -->

  <text x="440" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">CIE Four-Step Data Flow</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 1: INGEST                                   -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="20" y="50" width="180" height="180" rx="10" ry="10" fill="#fff" stroke="#00294D" stroke-width="2"/>

  <!-- Gold header -->
  <rect x="20" y="50" width="180" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="20" y="66" width="180" height="20" fill="#FFB81C"/>

  <!-- Step badge -->
  <circle cx="50" cy="68" r="14" fill="#00294D"/>
  <text x="50" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="120" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">INGEST</text>

  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#333">Connect identity sources</text>
  <text x="110" y="124" text-anchor="middle" font-size="10" fill="#333">and pull user/group data:</text>

  <text x="45" y="148" font-size="9.5" fill="#666">• Entra ID (Enterprise App)</text>
  <text x="45" y="163" font-size="9.5" fill="#666">• Okta (Client Cred)</text>
  <text x="45" y="178" font-size="9.5" fill="#666">• On-Prem AD (Agent)</text>
  <text x="45" y="193" font-size="9.5" fill="#666">• Google / SCIM / Local</text>

  <rect x="40" y="208" width="140" height="16" rx="4" ry="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.5"/>
  <text x="110" y="220" text-anchor="middle" font-size="8.5" font-weight="600" fill="#22c55e">Incremental + Full Sync</text>

  <!-- Arrow 1→2 -->
  <line x1="202" y1="140" x2="232" y2="140" stroke="#00294D" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#df-ar-r)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 2: NORMALIZE                                -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="240" y="50" width="180" height="180" rx="10" ry="10" fill="#fff" stroke="#00294D" stroke-width="2"/>

  <rect x="240" y="50" width="180" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="240" y="66" width="180" height="20" fill="#FFB81C"/>

  <circle cx="270" cy="68" r="14" fill="#00294D"/>
  <text x="270" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="340" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">NORMALIZE</text>

  <text x="330" y="108" text-anchor="middle" font-size="10" fill="#333">Unify identities across</text>
  <text x="330" y="124" text-anchor="middle" font-size="10" fill="#333">directories into one view:</text>

  <text x="265" y="148" font-size="9.5" fill="#666">• Deduplicate accounts</text>
  <text x="265" y="163" font-size="9.5" fill="#666">• Merge group memberships</text>
  <text x="265" y="178" font-size="9.5" fill="#666">• Build CDUGs</text>
  <text x="265" y="193" font-size="9.5" fill="#666">• Collect custom attributes</text>

  <rect x="260" y="208" width="140" height="16" rx="4" ry="4" fill="#e7f3ff" stroke="#006DCC" stroke-width="0.5"/>
  <text x="330" y="220" text-anchor="middle" font-size="8.5" font-weight="600" fill="#006DCC">Cloud Dynamic User Groups</text>

  <!-- Arrow 2→3 -->
  <line x1="422" y1="140" x2="452" y2="140" stroke="#00294D" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#df-ar-r)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 3: DISTRIBUTE                               -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="460" y="50" width="180" height="180" rx="10" ry="10" fill="#fff" stroke="#00294D" stroke-width="2"/>

  <rect x="460" y="50" width="180" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="460" y="66" width="180" height="20" fill="#FFB81C"/>

  <circle cx="490" cy="68" r="14" fill="#00294D"/>
  <text x="490" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="565" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">DISTRIBUTE</text>

  <text x="550" y="108" text-anchor="middle" font-size="10" fill="#333">Push user-to-IP mappings</text>
  <text x="550" y="124" text-anchor="middle" font-size="10" fill="#333">and context to subscribers:</text>

  <text x="485" y="148" font-size="9.5" fill="#666">• User-ID mappings</text>
  <text x="485" y="163" font-size="9.5" fill="#666">• Group membership</text>
  <text x="485" y="178" font-size="9.5" fill="#666">• CDUG tags</text>
  <text x="485" y="193" font-size="9.5" fill="#666">• Device attributes</text>

  <rect x="480" y="208" width="140" height="16" rx="4" ry="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="550" y="220" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">Redistribution Segments</text>

  <!-- Arrow 3→4 -->
  <line x1="642" y1="140" x2="672" y2="140" stroke="#00294D" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#df-ar-r)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 4: ENFORCE                                  -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="680" y="50" width="180" height="180" rx="10" ry="10" fill="#fff" stroke="#00294D" stroke-width="2"/>

  <rect x="680" y="50" width="180" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="680" y="66" width="180" height="20" fill="#FFB81C"/>

  <circle cx="710" cy="68" r="14" fill="#00294D"/>
  <text x="710" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="780" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">ENFORCE</text>

  <text x="770" y="108" text-anchor="middle" font-size="10" fill="#333">Firewalls apply identity-</text>
  <text x="770" y="124" text-anchor="middle" font-size="10" fill="#333">based security policy:</text>

  <text x="705" y="148" font-size="9.5" fill="#666">• User/group match rules</text>
  <text x="705" y="163" font-size="9.5" fill="#666">• CDUG-based policy</text>
  <text x="705" y="178" font-size="9.5" fill="#666">• Log user in traffic</text>
  <text x="705" y="193" font-size="9.5" fill="#666">• ACC visibility</text>

  <rect x="700" y="208" width="140" height="16" rx="4" ry="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.5"/>
  <text x="770" y="220" text-anchor="middle" font-size="8.5" font-weight="600" fill="#22c55e">User-Based Security Policy</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  FALLBACK: Unknown User → Trigger Auth            -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="320" y="270" width="240" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">Unknown User?</text>
  <text x="440" y="308" text-anchor="middle" font-size="10" fill="#333">Trigger Cloud Authentication (Phase 6)</text>

  <!-- Arrow from Enforce down to fallback -->
  <path d="M770,232 L770,295 L562,295" fill="none" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#df-ar-gold)"/>

  <!-- Label on fallback arrow -->
  <text x="680" y="285" text-anchor="middle" font-size="8.5" fill="#E5A300" font-weight="600">no mapping found</text>

</svg>
