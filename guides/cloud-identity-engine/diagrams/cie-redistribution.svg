<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="rd-ar-gold-up" markerWidth="7" markerHeight="10" refX="3.5" refY="1" orient="auto">
      <polygon points="0 10, 3.5 0, 7 10" fill="#E5A300"/>
    </marker>
    <marker id="rd-ar-blue-down" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#006DCC"/>
    </marker>
    <marker id="rd-ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00294D"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TITLE                                            -->
  <!-- ══════════════════════════════════════════════════ -->

  <text x="440" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">User-ID Redistribution: Publish / Subscribe Model</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  CIE USER CONTEXT HUB (TOP CENTER)                -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="240" y="44" width="400" height="120" rx="10" ry="10" fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <!-- Gold header -->
  <rect x="240" y="44" width="400" height="36" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="240" y="60" width="400" height="20" fill="#FFB81C"/>
  <text x="440" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">CIE User Context Service</text>

  <!-- Segment A -->
  <rect x="265" y="92" width="160" height="56" rx="6" ry="6" fill="#e7f3ff" stroke="#006DCC" stroke-width="1.5"/>
  <text x="345" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">Segment A</text>
  <text x="345" y="128" text-anchor="middle" font-size="9.5" fill="#666">Branch Office Users</text>
  <text x="345" y="142" text-anchor="middle" font-size="9" fill="#006DCC">domain: corp.example.com</text>

  <!-- Segment B -->
  <rect x="455" y="92" width="160" height="56" rx="6" ry="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="535" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">Segment B</text>
  <text x="535" y="128" text-anchor="middle" font-size="9.5" fill="#666">Data Center Users</text>
  <text x="535" y="142" text-anchor="middle" font-size="9" fill="#f59e0b">domain: dc.example.com</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PUBLISH ROW (middle area labels)                 -->
  <!-- ══════════════════════════════════════════════════ -->

  <text x="440" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#666">PUBLISH (gold ↑)  /  SUBSCRIBE (blue ↓)</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  FIREWALL ROW                                     -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- FW-1: HQ (publishes to Segment A) -->
  <rect x="30" y="240" width="170" height="110" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <rect x="30" y="240" width="170" height="30" rx="8" ry="8" fill="#00294D"/>
  <rect x="30" y="255" width="170" height="15" fill="#00294D"/>
  <text x="115" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">FW-1 (HQ)</text>
  <text x="115" y="293" text-anchor="middle" font-size="10" fill="#333">Publishes to Segment A</text>
  <text x="115" y="310" text-anchor="middle" font-size="9.5" fill="#666">Local User-ID agent</text>
  <text x="115" y="326" text-anchor="middle" font-size="9.5" fill="#666">sees login events</text>
  <rect x="60" y="334" width="110" height="14" rx="3" ry="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.5"/>
  <text x="115" y="345" text-anchor="middle" font-size="8" font-weight="600" fill="#22c55e">PUBLISHER</text>

  <!-- Arrow FW-1 → Segment A (publish up) -->
  <line x1="115" y1="238" x2="305" y2="166" stroke="#E5A300" stroke-width="2.5" marker-end="url(#rd-ar-gold-up)"/>

  <!-- FW-2: Branch 1 (subscribes to Segment A) -->
  <rect x="240" y="240" width="170" height="110" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <rect x="240" y="240" width="170" height="30" rx="8" ry="8" fill="#00294D"/>
  <rect x="240" y="255" width="170" height="15" fill="#00294D"/>
  <text x="325" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">FW-2 (Branch 1)</text>
  <text x="325" y="293" text-anchor="middle" font-size="10" fill="#333">Subscribes to Segment A</text>
  <text x="325" y="310" text-anchor="middle" font-size="9.5" fill="#666">Receives HQ mappings</text>
  <text x="325" y="326" text-anchor="middle" font-size="9.5" fill="#666">without local agent</text>
  <rect x="270" y="334" width="110" height="14" rx="3" ry="3" fill="#e7f3ff" stroke="#006DCC" stroke-width="0.5"/>
  <text x="325" y="345" text-anchor="middle" font-size="8" font-weight="600" fill="#006DCC">SUBSCRIBER</text>

  <!-- Arrow Segment A → FW-2 (subscribe down) -->
  <line x1="345" y1="166" x2="325" y2="238" stroke="#006DCC" stroke-width="2.5" marker-end="url(#rd-ar-blue-down)"/>

  <!-- FW-3: Branch 2 (subscribes to Segment A) -->
  <rect x="450" y="240" width="170" height="110" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <rect x="450" y="240" width="170" height="30" rx="8" ry="8" fill="#00294D"/>
  <rect x="450" y="255" width="170" height="15" fill="#00294D"/>
  <text x="535" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">FW-3 (Branch 2)</text>
  <text x="535" y="293" text-anchor="middle" font-size="10" fill="#333">Subscribes to Segment A</text>
  <text x="535" y="310" text-anchor="middle" font-size="9.5" fill="#666">Also receives HQ</text>
  <text x="535" y="326" text-anchor="middle" font-size="9.5" fill="#666">user-IP mappings</text>
  <rect x="480" y="334" width="110" height="14" rx="3" ry="3" fill="#e7f3ff" stroke="#006DCC" stroke-width="0.5"/>
  <text x="535" y="345" text-anchor="middle" font-size="8" font-weight="600" fill="#006DCC">SUBSCRIBER</text>

  <!-- Arrow Segment A → FW-3 (subscribe down) -->
  <line x1="365" y1="148" x2="535" y2="238" stroke="#006DCC" stroke-width="2.5" marker-end="url(#rd-ar-blue-down)"/>

  <!-- FW-4: DC (publishes to Segment B) -->
  <rect x="680" y="240" width="170" height="110" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <rect x="680" y="240" width="170" height="30" rx="8" ry="8" fill="#00294D"/>
  <rect x="680" y="255" width="170" height="15" fill="#00294D"/>
  <text x="765" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">FW-4 (Data Center)</text>
  <text x="765" y="293" text-anchor="middle" font-size="10" fill="#333">Publishes to Segment B</text>
  <text x="765" y="310" text-anchor="middle" font-size="9.5" fill="#666">DC login events</text>
  <text x="765" y="326" text-anchor="middle" font-size="9.5" fill="#666">captured by local agent</text>
  <rect x="710" y="334" width="110" height="14" rx="3" ry="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.5"/>
  <text x="765" y="345" text-anchor="middle" font-size="8" font-weight="600" fill="#22c55e">PUBLISHER</text>

  <!-- Arrow FW-4 → Segment B (publish up) -->
  <line x1="765" y1="238" x2="575" y2="148" stroke="#E5A300" stroke-width="2.5" marker-end="url(#rd-ar-gold-up)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  CROSS-SUBSCRIBE CALLOUT                          -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="220" y="380" width="440" height="46" rx="8" ry="8" fill="#e7f3ff" stroke="#006DCC" stroke-width="1"/>
  <text x="440" y="400" text-anchor="middle" font-size="10" font-weight="600" fill="#006DCC">Any firewall can subscribe to multiple segments.</text>
  <text x="440" y="416" text-anchor="middle" font-size="10" fill="#333">Cross-site visibility without VPN tunnels or WMI probes between sites.</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  LEGEND                                           -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="440" width="820" height="30" rx="6" ry="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <line x1="50" y1="455" x2="50" y2="445" stroke="#E5A300" stroke-width="2.5" marker-end="url(#rd-ar-gold-up)"/>
  <text x="65" y="458" font-size="10" fill="#333">Publish (FW → CIE)</text>

  <line x1="230" y1="445" x2="230" y2="455" stroke="#006DCC" stroke-width="2.5" marker-end="url(#rd-ar-blue-down)"/>
  <text x="245" y="458" font-size="10" fill="#333">Subscribe (CIE → FW)</text>

  <rect x="420" y="447" width="14" height="14" rx="3" ry="3" fill="#e7f3ff" stroke="#006DCC" stroke-width="1"/>
  <text x="442" y="459" font-size="10" fill="#333">Segment (logical grouping)</text>

  <rect x="620" y="447" width="14" height="14" rx="3" ry="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.5"/>
  <text x="642" y="459" font-size="10" fill="#333">Publisher role</text>

  <rect x="740" y="447" width="14" height="14" rx="3" ry="3" fill="#e7f3ff" stroke="#006DCC" stroke-width="0.5"/>
  <text x="762" y="459" font-size="10" fill="#333">Subscriber role</text>

</svg>
