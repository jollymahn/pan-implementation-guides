<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="af-ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00294D"/>
    </marker>
    <marker id="af-ar-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#00294D"/>
    </marker>
    <marker id="af-ar-blue-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006DCC"/>
    </marker>
    <marker id="af-ar-blue-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#006DCC"/>
    </marker>
    <marker id="af-ar-green-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="af-ar-green-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#22c55e"/>
    </marker>
    <marker id="af-ar-gold-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A300"/>
    </marker>
    <marker id="af-ar-gold-l" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#E5A300"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  TITLE                                            -->
  <!-- ══════════════════════════════════════════════════ -->

  <text x="440" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">CIE Authentication Redirect Flow (8 Steps)</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  SWIMLANE HEADERS                                 -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- User -->
  <rect x="30" y="40" width="130" height="36" rx="8" ry="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="95" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">User / Browser</text>
  <line x1="95" y1="80" x2="95" y2="530" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- NGFW -->
  <rect x="240" y="40" width="130" height="36" rx="8" ry="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="305" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">NGFW</text>
  <line x1="305" y1="80" x2="305" y2="530" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- CIE -->
  <rect x="450" y="40" width="160" height="36" rx="8" ry="8" fill="#e7f3ff" stroke="#006DCC" stroke-width="1.5"/>
  <text x="530" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">CIE Cloud Auth</text>
  <line x1="530" y1="80" x2="530" y2="530" stroke="#006DCC" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- IdP -->
  <rect x="700" y="40" width="150" height="36" rx="8" ry="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="775" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">External IdP</text>
  <text x="775" y="55" text-anchor="middle" font-size="8" fill="#666">(Entra / Okta / Google / etc.)</text>
  <line x1="775" y1="80" x2="775" y2="530" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 1: User → NGFW (HTTP request)               -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="60" cy="110" r="13" fill="#00294D"/>
  <text x="60" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>

  <line x1="95" y1="110" x2="293" y2="110" stroke="#00294D" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-r)"/>
  <text x="194" y="104" text-anchor="middle" font-size="9.5" fill="#333">HTTP/HTTPS request to web resource</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 2: NGFW checks — no mapping                 -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="255" y="130" width="100" height="30" rx="5" ry="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="305" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">No User-ID mapping</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 2: NGFW → User (302 redirect)               -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="60" cy="180" r="13" fill="#00294D"/>
  <text x="60" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>

  <line x1="293" y1="180" x2="107" y2="180" stroke="#00294D" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-l)"/>
  <text x="200" y="174" text-anchor="middle" font-size="9.5" fill="#333">302 Redirect → CIE Auth Portal</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 3: User → CIE (browser redirect)            -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="60" cy="230" r="13" fill="#006DCC"/>
  <text x="60" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>

  <line x1="107" y1="230" x2="518" y2="230" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-blue-r)"/>
  <text x="310" y="224" text-anchor="middle" font-size="9.5" fill="#006DCC">Browser follows redirect to CIE authentication endpoint</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 4: CIE → IdP (SAML/OIDC request)           -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="470" cy="280" r="13" fill="#E5A300"/>
  <text x="470" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>

  <line x1="542" y1="280" x2="763" y2="280" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-gold-r)"/>
  <text x="652" y="274" text-anchor="middle" font-size="9.5" fill="#b45309">SAML AuthnRequest / OIDC auth redirect</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 5: IdP → User (login prompt + MFA)          -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="815" cy="330" r="13" fill="#E5A300"/>
  <text x="815" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>

  <line x1="763" y1="330" x2="107" y2="330" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-gold-l)"/>
  <text x="440" y="324" text-anchor="middle" font-size="9.5" fill="#b45309">IdP presents login page → user authenticates + MFA (at IdP)</text>

  <!-- MFA callout -->
  <rect x="340" y="340" width="200" height="24" rx="4" ry="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="440" y="357" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">MFA enforced by IdP, not CIE</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 6: IdP → CIE (assertion/token)              -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="815" cy="390" r="13" fill="#006DCC"/>
  <text x="815" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>

  <line x1="763" y1="390" x2="542" y2="390" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-blue-l)"/>
  <text x="652" y="384" text-anchor="middle" font-size="9.5" fill="#006DCC">SAML Assertion / OIDC ID Token</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 7: CIE creates mapping, redirects back      -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="480" y="416" width="100" height="26" rx="5" ry="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="530" y="434" text-anchor="middle" font-size="8.5" font-weight="600" fill="#22c55e">Create User-IP mapping</text>

  <circle cx="470" cy="460" r="13" fill="#22c55e"/>
  <text x="470" y="465" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text>

  <line x1="518" y1="460" x2="317" y2="460" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-green-l)"/>
  <text x="420" y="454" text-anchor="middle" font-size="9.5" fill="#16a34a">Mapping pushed → NGFW</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  STEP 8: NGFW → User (access granted)             -->
  <!-- ══════════════════════════════════════════════════ -->

  <circle cx="60" cy="505" r="13" fill="#22c55e"/>
  <text x="60" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text>

  <line x1="293" y1="505" x2="107" y2="505" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#af-ar-green-l)"/>
  <text x="200" y="499" text-anchor="middle" font-size="9.5" fill="#16a34a">Access granted — user identified</text>

  <rect x="255" y="485" width="100" height="26" rx="5" ry="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="305" y="502" text-anchor="middle" font-size="8.5" font-weight="600" fill="#22c55e">Policy match: allow</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  BOTTOM NOTE                                      -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="30" y="540" width="820" height="30" rx="6" ry="6" fill="#e7f3ff" stroke="none"/>
  <text x="440" y="560" text-anchor="middle" font-size="10" fill="#006DCC">
    Subsequent requests from the same IP skip steps 2-7 until the mapping expires (configurable timer).
  </text>

</svg>
