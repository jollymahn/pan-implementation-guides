<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540"
     style="font-family:Helvetica,Arial,sans-serif;background:#fff;">

  <defs>
    <marker id="ar-gold-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A300"/>
    </marker>
    <marker id="ar-blue-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006DCC"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  COLUMN HEADERS                                   -->
  <!-- ══════════════════════════════════════════════════ -->

  <text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#666">IDENTITY SOURCES</text>
  <text x="440" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#666">CIE CLOUD SERVICE</text>
  <text x="770" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#666">ENFORCEMENT POINTS</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  LEFT COLUMN: Identity Sources                    -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Entra ID -->
  <rect x="20" y="42" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="110" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">Microsoft Entra ID</text>
  <text x="110" y="84" text-anchor="middle" font-size="9.5" fill="#666">Enterprise App / Client Cred</text>

  <!-- Okta -->
  <rect x="20" y="110" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="110" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">Okta</text>
  <text x="110" y="152" text-anchor="middle" font-size="9.5" fill="#666">Client Cred / Auth Code Flow</text>

  <!-- Google Workspace -->
  <rect x="20" y="178" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="110" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">Google Workspace</text>
  <text x="110" y="220" text-anchor="middle" font-size="9.5" fill="#666">OAuth Admin SDK</text>

  <!-- On-Prem AD -->
  <rect x="20" y="246" width="180" height="70" rx="8" ry="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">On-Prem Active Directory</text>
  <text x="110" y="289" text-anchor="middle" font-size="9.5" fill="#666">Cloud Identity Agent</text>
  <text x="110" y="305" text-anchor="middle" font-size="9" fill="#f59e0b">(Windows service on-prem)</text>

  <!-- SCIM Connector -->
  <rect x="20" y="328" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="110" y="351" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">SCIM Connector</text>
  <text x="110" y="370" text-anchor="middle" font-size="9.5" fill="#666">Entra / Okta / Ping / Idira</text>

  <!-- CIE Local Directory -->
  <rect x="20" y="396" width="180" height="56" rx="8" ry="8" fill="#e7f3ff" stroke="#006DCC" stroke-width="1.5"/>
  <text x="110" y="419" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">CIE Local Directory</text>
  <text x="110" y="438" text-anchor="middle" font-size="9.5" fill="#666">Manual / CSV (up to 200 users)</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  CENTER: CIE Cloud Service Hub                    -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="290" y="42" width="300" height="410" rx="10" ry="10" fill="#fff" stroke="#00294D" stroke-width="2.5"/>

  <!-- Gold header -->
  <rect x="290" y="42" width="300" height="40" rx="10" ry="10" fill="#FFB81C"/>
  <rect x="290" y="62" width="300" height="20" fill="#FFB81C"/>
  <text x="440" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#00294D">CIE Cloud Service (Hub)</text>

  <!-- Sub-box 1: Directory Sync Engine -->
  <rect x="310" y="94" width="260" height="90" rx="6" ry="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="440" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">Directory Sync Engine</text>
  <text x="440" y="135" text-anchor="middle" font-size="10" fill="#333">Aggregates users, groups, devices</text>
  <text x="440" y="150" text-anchor="middle" font-size="10" fill="#333">from all connected directories.</text>
  <text x="440" y="165" text-anchor="middle" font-size="10" fill="#333">Builds Cloud Dynamic User Groups.</text>

  <!-- Sub-box 2: Cloud Authentication Service -->
  <rect x="310" y="196" width="260" height="90" rx="6" ry="6" fill="#e7f3ff" stroke="#006DCC" stroke-width="1"/>
  <text x="440" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">Cloud Authentication Service</text>
  <text x="440" y="237" text-anchor="middle" font-size="10" fill="#333">Brokers authentication via</text>
  <text x="440" y="252" text-anchor="middle" font-size="10" fill="#333">SAML 2.0, OIDC, Client Certificate,</text>
  <text x="440" y="267" text-anchor="middle" font-size="10" fill="#333">or Password to external IdPs.</text>

  <!-- Sub-box 3: User Context / Redistribution -->
  <rect x="310" y="298" width="260" height="90" rx="6" ry="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="440" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#00294D">User Context &amp; Redistribution</text>
  <text x="440" y="339" text-anchor="middle" font-size="10" fill="#333">Distributes user-to-IP mappings,</text>
  <text x="440" y="354" text-anchor="middle" font-size="10" fill="#333">group membership, and CDUG data</text>
  <text x="440" y="369" text-anchor="middle" font-size="10" fill="#333">to subscribed enforcement points.</text>

  <!-- Region badge -->
  <rect x="350" y="400" width="180" height="28" rx="14" ry="14" fill="#00294D"/>
  <text x="440" y="419" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Region: permanent selection</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  RIGHT COLUMN: Enforcement Points                 -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- NGFW -->
  <rect x="680" y="62" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="770" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">NGFW</text>
  <text x="770" y="104" text-anchor="middle" font-size="9.5" fill="#666">PAN-OS 10.1+ required</text>

  <!-- Panorama -->
  <rect x="680" y="140" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="770" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">Panorama</text>
  <text x="770" y="182" text-anchor="middle" font-size="9.5" fill="#666">Centralized mgmt + push</text>

  <!-- SCM -->
  <rect x="680" y="218" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="770" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">Strata Cloud Manager</text>
  <text x="770" y="260" text-anchor="middle" font-size="9.5" fill="#666">Cloud-native management</text>

  <!-- Prisma Access -->
  <rect x="680" y="296" width="180" height="56" rx="8" ry="8" fill="#fff" stroke="#00294D" stroke-width="1.5"/>
  <text x="770" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#00294D">Prisma Access</text>
  <text x="770" y="338" text-anchor="middle" font-size="9.5" fill="#666">GlobalProtect + Browser</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  ARROWS: Sources → Hub (Gold, ingest)             -->
  <!-- ══════════════════════════════════════════════════ -->

  <line x1="200" y1="70" x2="288" y2="130" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>
  <line x1="200" y1="138" x2="288" y2="138" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>
  <line x1="200" y1="206" x2="288" y2="160" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>
  <line x1="200" y1="281" x2="288" y2="240" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>
  <line x1="200" y1="356" x2="288" y2="340" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>
  <line x1="200" y1="424" x2="288" y2="370" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>

  <!-- Protocol labels on source arrows -->
  <text x="240" y="90" text-anchor="middle" font-size="8" fill="#E5A300" font-weight="600">HTTPS</text>
  <text x="244" y="132" text-anchor="middle" font-size="8" fill="#E5A300" font-weight="600">HTTPS</text>
  <text x="240" y="175" text-anchor="middle" font-size="8" fill="#E5A300" font-weight="600">OAuth</text>
  <text x="236" y="252" text-anchor="middle" font-size="8" fill="#E5A300" font-weight="600">mTLS</text>
  <text x="240" y="340" text-anchor="middle" font-size="8" fill="#E5A300" font-weight="600">HTTPS</text>
  <text x="242" y="392" text-anchor="middle" font-size="8" fill="#006DCC" font-weight="600">internal</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  ARROWS: Hub → Consumers (Blue, distribute)       -->
  <!-- ══════════════════════════════════════════════════ -->

  <line x1="592" y1="130" x2="678" y2="90" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-blue-r)"/>
  <line x1="592" y1="180" x2="678" y2="168" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-blue-r)"/>
  <line x1="592" y1="240" x2="678" y2="246" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-blue-r)"/>
  <line x1="592" y1="340" x2="678" y2="324" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-blue-r)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  LEGEND                                           -->
  <!-- ══════════════════════════════════════════════════ -->

  <rect x="20" y="470" width="840" height="50" rx="8" ry="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <line x1="40" y1="495" x2="90" y2="495" stroke="#E5A300" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-gold-r)"/>
  <text x="100" y="499" font-size="10.5" fill="#333">Identity Ingest (directories → CIE)</text>

  <line x1="340" y1="495" x2="390" y2="495" stroke="#006DCC" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar-blue-r)"/>
  <text x="400" y="499" font-size="10.5" fill="#333">Identity Distribution (CIE → enforcement)</text>

  <rect x="640" y="485" width="14" height="14" rx="3" ry="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="662" y="497" font-size="10.5" fill="#333">On-prem component</text>

  <rect x="770" y="485" width="14" height="14" rx="3" ry="3" fill="#e7f3ff" stroke="#006DCC" stroke-width="1"/>
  <text x="792" y="497" font-size="10.5" fill="#333">Internal</text>

</svg>
