<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Lato, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0078d4"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="340" fill="#fafafa" rx="10"/>

  <!-- ── Azure VNet region ── -->
  <rect x="20" y="20" width="310" height="300" rx="8" fill="#e8f4fd" stroke="#0078d4" stroke-width="2"/>
  <text x="175" y="44" text-anchor="middle" font-weight="700" font-size="14" fill="#0078d4">Azure VNet</text>

  <!-- Cloud NGFW resource box -->
  <rect x="45" y="60" width="260" height="110" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="175" y="82" text-anchor="middle" font-weight="700" fill="#00294D">Cloud NGFW Resource</text>
  <text x="175" y="102" text-anchor="middle" font-size="11" fill="#444">Security Processing VMs</text>
  <text x="175" y="120" text-anchor="middle" font-size="11" fill="#444">Public subnet CIDR</text>
  <text x="175" y="140" text-anchor="middle" font-size="11" fill="#666">Source IP: Cloud NGFW public IP</text>
  <text x="175" y="158" text-anchor="middle" font-size="10" fill="#888">(SNAT applied)</text>

  <!-- SNAT banner -->
  <rect x="45" y="188" width="260" height="50" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="175" y="208" text-anchor="middle" font-weight="600" font-size="11" fill="#92400e">Source NAT</text>
  <text x="175" y="226" text-anchor="middle" font-size="10" fill="#78350f">Networking &amp; NAT &gt; Source NAT</text>
  <text x="175" y="240" text-anchor="middle" font-size="10" fill="#78350f">"Use the above public IP addresses"</text>

  <!-- Ports label box below VNet -->
  <rect x="45" y="255" width="260" height="44" rx="5" fill="#f0f7ff" stroke="#0078d4" stroke-width="1"/>
  <text x="175" y="273" text-anchor="middle" font-weight="600" font-size="11" fill="#1d4ed8">Required outbound ports</text>
  <text x="175" y="290" text-anchor="middle" font-size="10" fill="#1d4ed8">TCP 3978 · 28443 · 28270</text>

  <!-- ── Internet cloud ── -->
  <ellipse cx="490" cy="150" rx="82" ry="58" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="490" y="144" text-anchor="middle" font-size="13" fill="#555">Internet</text>
  <text x="490" y="162" text-anchor="middle" font-size="10" fill="#777">SSL Tunnel</text>

  <!-- ── Panorama side ── -->
  <rect x="590" y="20" width="310" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="44" text-anchor="middle" font-weight="700" font-size="14" fill="#15803d">Panorama Appliance</text>
  <text x="745" y="60" text-anchor="middle" font-size="11" fill="#166534">(on-premises or Azure VM — public IP)</text>

  <!-- Panorama box -->
  <rect x="615" y="72" width="260" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="745" y="98" text-anchor="middle" font-weight="700" fill="#00294D">Panorama</text>
  <text x="745" y="118" text-anchor="middle" font-size="11" fill="#444">Public IP: x.x.x.x</text>
  <text x="745" y="136" text-anchor="middle" font-size="11" fill="#444">Listens for inbound SSL on port 3978</text>

  <!-- NSG rule box -->
  <rect x="615" y="172" width="260" height="80" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="745" y="195" text-anchor="middle" font-weight="700" font-size="12" fill="#1e40af">NSG Inbound Rule</text>
  <text x="745" y="214" text-anchor="middle" font-size="10" fill="#1e40af">Source: Cloud NGFW public IP</text>
  <text x="745" y="230" text-anchor="middle" font-size="10" fill="#1e40af">Ports: TCP 3978, 28443, 28270</text>
  <text x="745" y="246" text-anchor="middle" font-size="10" fill="#1e40af">Action: Allow</text>

  <!-- Return path / UDR note -->
  <rect x="615" y="270" width="260" height="36" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="745" y="287" text-anchor="middle" font-size="10" fill="#854d0e">If asymmetric routing occurs: add UDR</text>
  <text x="745" y="301" text-anchor="middle" font-size="10" fill="#854d0e">host routes for CNGFW DNAT IPs</text>

  <!-- ── Arrows ── -->
  <!-- CNGFW → Internet (outbound) -->
  <line x1="330" y1="135" x2="408" y2="135" stroke="#0078d4" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Internet → Panorama (inbound) -->
  <line x1="572" y1="135" x2="612" y2="110" stroke="#0078d4" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Return arrow (Panorama → Internet → CNGFW), below -->
  <line x1="612" y1="165" x2="572" y2="178" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
  <line x1="408" y1="178" x2="330" y2="165" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>

  <!-- Labels on arrows -->
  <text x="369" y="125" text-anchor="middle" font-size="10" fill="#0078d4">outbound</text>
  <text x="369" y="195" text-anchor="middle" font-size="10" fill="#666">return</text>
</svg>
